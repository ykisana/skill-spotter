name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes older runs pointless; free the runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          # macOS ships Python 3.9 as /usr/bin/python3, the oldest a hook may run under.
          # One macOS job only: hosted macOS runners are scarce and cost 10x on private repos.
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest

  replay:
    # SPEC 11.9: replay a fixed subset of the synthetic test split through the real hook
    # code on every push, to catch matching regressions. Standard library only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m bench.replay --quick --min-precision 0.9 --min-recall 0.6
